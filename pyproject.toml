[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["node_modules", "dist", "out"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "C90", "E", "F", "I", "PERF", "PL", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-args = 8
