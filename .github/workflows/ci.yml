name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Lint Python with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          # v4.1.0 ships known checksums only up to 0.15.20, and the action
          # downloads from the Astral CDN mirror, so 0.16.0 would otherwise be
          # installed unverified. SHA-256 of ruff-x86_64-unknown-linux-gnu.tar.gz
          # (ubuntu-latest target) from the ruff 0.16.0 release assets.
          checksum: "98001c995a134d95f9bc83106a7f94b552971b583f1c0ab75fb656a881e13865"
          args: check main.py decky.pyi tests scripts

      - name: Check Python formatting
        run: ruff format --check main.py decky.pyi tests scripts

      - name: Validate source
        run: pnpm check

      - name: Validate manual-install package
        run: pnpm package
